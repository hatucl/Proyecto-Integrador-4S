<div class="auth-wrap">
  <div class="card auth-card">
    <div class="text-center mb-4">
      <span class="brand-mark mx-auto mb-3" style="width:52px;height:52px;border-radius:14px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:28px;height:28px">
          <path d="M3 9a2 2 0 0 0 0 6v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2a2 2 0 0 1 0-6V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/>
          <path d="M14 6v12" stroke-dasharray="2 2.5"/>
        </svg>
      </span>
      <h2 class="mb-1">Bienvenido de nuevo</h2>
      <p class="text-secondary mb-0">Inicia sesión para reservar tus entradas</p>
    </div>

    @if (errorMsg()) {
      <div class="alert alert-danger py-2 text-center small">{{ errorMsg() }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="correo">Correo electrónico</label>
        <input id="correo" type="email" class="form-control" formControlName="correo" placeholder="tucorreo&#64;ejemplo.com" autocomplete="email">
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password" placeholder="••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" [disabled]="loginForm.invalid || cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <p class="text-center text-secondary mb-0">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="fw-semibold text-decoration-none">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
