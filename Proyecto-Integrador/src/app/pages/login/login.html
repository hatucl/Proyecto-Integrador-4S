<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg rounded-4"
        style="width: 100%; max-width: 400px; background-color: #1a1a1a; border: 1px solid #333;">

        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">GameTickets</h2>
            <p class="text-secondary">Inicia sesión para continuar</p>
        </div>
        @if (errorMsg) {
        <div class="alert alert-danger py-2 text-center">
            {{ errorMsg }}
        </div>
        }
        <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
            <div class="mb-3">
                <label class="form-label text-white">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" formControlName="correo"
                    placeholder="usuario@correo.com">
            </div>

            <div class="mb-4">
                <label class="form-label text-white">Contraseña</label>
                <input type="password" class="form-control bg-dark text-white border-secondary"
                    formControlName="password" placeholder="******">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" [disabled]="loginForm.invalid">
                Ingresar
            </button>

            <div class="text-center mt-3">
                <span class="text-secondary">¿No tienes cuenta? </span>
                <a routerLink="/registro" class="text-primary text-decoration-none fw-bold">Regístrate aquí</a>
            </div>
        </form>

    </div>
</div>
