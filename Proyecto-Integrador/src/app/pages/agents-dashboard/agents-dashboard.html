<div class="container py-5 text-white">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <span class="badge bg-warning text-dark mb-1">ÁREA DE AGENTE</span>
      <h2 class="fw-bold mb-0">Gestión de Catálogo y Preventas</h2>
    </div>
    <button class="btn btn-primary">+ Nuevo Videojuego</button>
  </div>

  <div class="card p-4 shadow rounded-4" style="background-color: #1a1a1a; border: 1px solid #333;">
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle mb-0">
        <thead>
          <tr class="text-secondary">
            <th>ID</th>
            <th>Título del Juego</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (juego of juegosInventario; track juego.id) {
            <tr>
              <td>#{{ juego.id }}</td>
              <td class="fw-semibold">{{ juego.titulo }}</td>
              <td>${{ juego.precio }}</td>
              <td>{{ juego.stock }} uds.</td>
              <td><span class="badge bg-info text-dark">{{ juego.estado }}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-warning me-2">Editar</button>
                <button class="btn btn-sm btn-outline-danger">Eliminar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
