<div class="p-5 mb-5 rounded-4" style="background-color: #1a1a1a; border: 1px solid #333;">
    <div class="container-fluid py-4">
        <h1 class="display-5 fw-bold text-white mb-3">Lanzamientos Exclusivos</h1>
        <p class="fs-5 text-secondary mb-4 col-md-8">Asegura tu copia de los juegos más esperados del año. Reserva
            ahora, evita las filas virtuales y obtén contenido adicional exclusivo.</p>
        <button class="btn btn-primary btn-lg">Ver catálogo completo</button>
    </div>
</div>

<h3 class="text-white mb-4">Tendencias</h3>

<div class="row g-4">

    @for (game of games; track game.id) {
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm" style="background-color: #1a1a1a; border: 1px solid #333;">

            <img [src]="game.image" class="card-img-top" alt="Portada del juego">

            <div class="card-body d-flex flex-column">
                <h5 class="card-title text-primary fw-bold">{{ game.title }}</h5>
                <p class="card-text text-secondary mb-4">{{ game.genre }}</p>

                <div class="mt-auto d-flex justify-content-between align-items-center">
                    <span class="fs-4 fw-bold text-white">${{ game.price }}</span>
                    <button [routerLink]="['/game', game.id]" class="btn btn-outline-light">Reservar</button>
                </div>
            </div>
        </div>
    </div>
    }

</div>
