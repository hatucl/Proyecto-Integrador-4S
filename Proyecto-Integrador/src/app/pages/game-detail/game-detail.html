<div class="container mt-5 text-white">
  
  <button routerLink="/" class="btn btn-outline-secondary mb-4">
    &larr; Volver al catálogo
  </button>

  @if (game) {
    <div class="row g-5">
      <div class="col-12 col-lg-4">
        <img [src]="game.image" class="img-fluid rounded-4 shadow-lg w-100" alt="Portada de {{ game.title }}">
      </div>

      <div class="col-12 col-lg-8">
        <span class="badge bg-primary fs-6 mb-2">{{ game.genre }}</span>
        <h1 class="display-4 fw-bold mb-3">{{ game.title }}</h1>
        <p class="fs-5 text-secondary mb-4">{{ game.description }}</p>
        
        <div class="p-4 rounded-4" style="background-color: #1a1a1a; border: 1px solid #333;">
          <h4 class="text-white mb-3">Reserva tu entrada / copia</h4>
          <div class="d-flex align-items-center justify-content-between">
            <span class="display-6 fw-bold text-primary">${{ game.price }}</span>
            <button (click)="reservarJuego()" class="btn btn-primary btn-lg">Añadir al Carrito</button>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="text-center mt-5">
      <h2>Juego no encontrado</h2>
      <p class="text-secondary">El título que buscas no está disponible.</p>
    </div>
  }

</div>
