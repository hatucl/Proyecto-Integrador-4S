version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: eventos_postgres
    restart: always
    environment:
      POSTGRES_USER: admin_eventos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sistema_eventos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: eventos_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eventos.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data: